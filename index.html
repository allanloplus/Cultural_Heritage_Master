<!-- 本站檔案網址的 ?v= 是版本戳記：改了 assets/ 底下的 CSS／JS 就把日期改掉，手機與平板才不會沿用舊快取 -->
<script src="assets/js/config.js?v=20261107b"></script>
<!-- Supabase 用戶端：一般 script 標籤載入（不用 document.write，手機網路慢時瀏覽器可能擋掉 document.write 的外部程式）；示範模式不會用到 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/store.js?v=20261107b"></script>
<script src="assets/js/app.js?v=20261107b"></script>
<script>
  /* 安全網：15 秒後還在啟動，就說明卡在哪一步並提供重新整理（data-boot：沒有＝程式沒載入，app＝讀取清單或登入狀態中） */
  setTimeout(function () {
    var st = document.documentElement.getAttribute("data-boot");
    if (st === "done") return;
    var v = document.getElementById("view");
    v.innerHTML = '<div class="notice bad"><b>網站啟動得比平常久。</b><br>' +
      (st === "app" ? "正在讀取文資清單或登入狀態。若同時開了好幾個「文資達人訪查」分頁，請先關閉其他分頁。" : "網站程式沒有載入完成，可能是網路不穩。") +
      '<br><button class="btn btn-sm btn-p" style="margin-top:8px" onclick="location.reload()">重新整理</button></div>';
  }, 15000);
</script>
</body>
</html>
